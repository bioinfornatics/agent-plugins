name: Bun release build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bun-release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test ${{ matrix.release-key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release-key: linux-x64
            runner: ubuntu-24.04
            bun-target: bun-linux-x64-baseline
            expected-platform: linux
            expected-arch: x64
          - release-key: linux-arm64
            runner: ubuntu-24.04-arm
            bun-target: bun-linux-arm64
            expected-platform: linux
            expected-arch: arm64
          - release-key: darwin-x64
            runner: macos-15-intel
            bun-target: bun-darwin-x64
            expected-platform: darwin
            expected-arch: x64
          - release-key: darwin-arm64
            runner: macos-15-arm64
            bun-target: bun-darwin-arm64
            expected-platform: darwin
            expected-arch: arm64
          - release-key: win32-x64
            runner: windows-2025
            bun-target: bun-windows-x64-baseline
            expected-platform: win32
            expected-arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BUN_BUILD_TARGET: ${{ matrix.bun-target }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12

      - name: Assert native target runner
        shell: bash
        run: |
          node -e 'const [platform, arch] = process.argv.slice(1); if (process.platform !== platform || process.arch !== arch) { console.error(`Refusing to execute ${platform}-${arch} output on ${process.platform}-${process.arch}`); process.exit(1); }' "${{ matrix.expected-platform }}" "${{ matrix.expected-arch }}"

      - name: Build target executables
        run: bun scripts/build-bun-executables.mjs --target=${{ matrix.bun-target }}

      - name: Smoke-test native executables
        run: node --test tests/test_bun_executables.test.ts

      - name: Package and execute the Skill Creator release artifact
        run: node --test apps/skill-creator-cli/tests/test_package_skill.test.ts

      - name: Upload tested release staging tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: creators-${{ matrix.release-key }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-staging/${{ matrix.release-key }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified release assets
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download every tested matrix artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: creators-*-${{ github.sha }}-${{ github.run_attempt }}
          path: release-input

      - name: Create deterministic archives and checksums
        run: node scripts/package-bun-release-assets.mjs release-input release-assets

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to replace its assets." >&2
            exit 1
          fi

      - name: Create draft release with all verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "Agent Plugins ${GITHUB_REF_NAME}" \
            --notes-file RELEASES.md

      - name: Publish the complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
