name: Development verification
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to verify
        required: false
        type: string
permissions:
  contents: read
jobs:
  quick:
    name: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Install checksum-pinned Goose
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/aaif-goose/goose/releases/download/v1.57.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          echo 'e54036f3b7f95d3b0d7854c09465af5ef52a28c7fa03d2497d0ea68a6382282d  /tmp/goose.tar.bz2' | sha256sum -c -
          mkdir -p /tmp/goose-bin
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-bin
          echo /tmp/goose-bin >> "$GITHUB_PATH"
          echo "GOOSE_TEST_BINARY=/tmp/goose-bin/goose" >> "$GITHUB_ENV"
          echo "CI_REQUIRE_GOOSE_HOST=1" >> "$GITHUB_ENV"
          test -x /tmp/goose-bin/goose
      - name: Restore offline development dependencies
        run: node scripts/prepare-development.mjs
      - name: Clean source rebuild and committed runtime coherence
        run: node scripts/ci-step.mjs clean-build node scripts/rebuild-production.mjs
      - name: Critical regression feedback before expensive suites
        run: node scripts/ci-step.mjs quick node scripts/ci-tests.mjs quick
      - name: Upload detailed verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-ci-quick
          path: .artifacts/ci-logs
          retention-days: 14
          if-no-files-found: ignore
  skill:
    needs: quick
    name: skill-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Install checksum-pinned Goose
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/aaif-goose/goose/releases/download/v1.57.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          echo 'e54036f3b7f95d3b0d7854c09465af5ef52a28c7fa03d2497d0ea68a6382282d  /tmp/goose.tar.bz2' | sha256sum -c -
          mkdir -p /tmp/goose-bin
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-bin
          echo /tmp/goose-bin >> "$GITHUB_PATH"
          echo "GOOSE_TEST_BINARY=/tmp/goose-bin/goose" >> "$GITHUB_ENV"
          echo "CI_REQUIRE_GOOSE_HOST=1" >> "$GITHUB_ENV"
          test -x /tmp/goose-bin/goose
      - name: Restore offline development dependencies
        run: node scripts/prepare-development.mjs
      # Jobs have separate checkouts: quick's ignored dist is not available here.
      - name: Compile this isolated app before compiled runtime consumers
        run: node scripts/ci-step.mjs skill-build node apps/agent-plugin/scripts/build.mjs
      - name: Execute complete declared agent-plugin shard
        run: node scripts/ci-step.mjs skill-${{ matrix.shard }} node scripts/ci-tests.mjs skill ${{ matrix.shard }}
      - name: Upload detailed verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-ci-skill-${{ matrix.shard }}
          path: .artifacts/ci-logs
          retention-days: 14
          if-no-files-found: ignore
  remaining:
    needs: quick
    name: remaining
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Install checksum-pinned Goose
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/aaif-goose/goose/releases/download/v1.57.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          echo 'e54036f3b7f95d3b0d7854c09465af5ef52a28c7fa03d2497d0ea68a6382282d  /tmp/goose.tar.bz2' | sha256sum -c -
          mkdir -p /tmp/goose-bin
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-bin
          echo /tmp/goose-bin >> "$GITHUB_PATH"
          echo "GOOSE_TEST_BINARY=/tmp/goose-bin/goose" >> "$GITHUB_ENV"
          echo "CI_REQUIRE_GOOSE_HOST=1" >> "$GITHUB_ENV"
          test -x /tmp/goose-bin/goose
      - name: Restore offline development dependencies
        run: node scripts/prepare-development.mjs
      - name: Rebuild this isolated job before dist consumers
        run: node scripts/ci-step.mjs remaining-build node scripts/rebuild-production.mjs
      - name: Remaining production-profile gates (agent-plugin required separately)
        run: node scripts/ci-step.mjs production-tests node scripts/ci-tests.mjs remaining
      - name: Upload detailed verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-ci-remaining
          path: .artifacts/ci-logs
          retention-days: 14
          if-no-files-found: ignore
  verify:
    name: verify
    needs: [quick, skill, remaining]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every verification job
        env:
          QUICK: ${{ needs.quick.result }}
          SKILL: ${{ needs.skill.result }}
          REMAINING: ${{ needs.remaining.result }}
        run: test "$QUICK" = success && test "$SKILL" = success && test "$REMAINING" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Install checksum-pinned Goose
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/aaif-goose/goose/releases/download/v1.57.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          echo 'e54036f3b7f95d3b0d7854c09465af5ef52a28c7fa03d2497d0ea68a6382282d  /tmp/goose.tar.bz2' | sha256sum -c -
          mkdir -p /tmp/goose-bin
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-bin
          echo /tmp/goose-bin >> "$GITHUB_PATH"
          echo "GOOSE_TEST_BINARY=/tmp/goose-bin/goose" >> "$GITHUB_ENV"
          echo "CI_REQUIRE_GOOSE_HOST=1" >> "$GITHUB_ENV"
          test -x /tmp/goose-bin/goose
      - name: Restore offline development dependencies
        run: node scripts/prepare-development.mjs
      - name: Verify production projection and Git installation
        run: |
          node scripts/ci-step.mjs projection node scripts/prepare-evaluation-candidate.mjs prepare .artifacts/candidate
          node .artifacts/candidate/plugin/skills/skill-creator/scripts/skill-creator.mjs evaluation --plugin "$PWD/.artifacts/candidate/plugin" --dry-run > .artifacts/candidate-plan.json
          node scripts/ci-step.mjs git-install node scripts/test-production-install.mjs .artifacts/candidate/production
      - name: Freeze mode-preserving candidate transport
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          CANDIDATE_SOURCE: ${{ github.sha }}
        run: node scripts/candidate-transfer.mjs pack .artifacts/candidate .artifacts/candidate.json
      - name: Upload canonical frozen candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evaluation-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/candidate.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload detailed verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-ci-projection
          path: .artifacts/ci-logs
          retention-days: 14
          if-no-files-found: ignore
