name: Bilingual documentation
on:
  push:
    branches: [develop]
    paths: ['docs/site/**', 'docs/assets/**', 'docs/overrides/**', 'docs/requirements*', 'zensical.*.toml', 'scripts/*documentation*', '.github/workflows/documentation.yml']
  pull_request:
    branches: [develop]
    paths: ['docs/site/**', 'docs/assets/**', 'docs/overrides/**', 'docs/requirements*', 'zensical.*.toml', 'scripts/*documentation*', '.github/workflows/documentation.yml']
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0' # Latest LTS, pinned for reproducibility (2026-11-10)
          package-manager-cache: false
      - run: pip install --require-hashes -r docs/requirements.txt
      - run: bash scripts/build-documentation.sh
      - run: python3 scripts/test-documentation-integrity.py
      - name: Install isolated browser tooling
        run: |
          mkdir -p .artifacts/documentation/browser
          npm install --prefix .artifacts/documentation/browser --ignore-scripts --no-audit --no-fund playwright-core@1.60.0
          echo "PLAYWRIGHT_MODULE=$PWD/.artifacts/documentation/browser/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
      - run: node scripts/test-documentation-browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: .artifacts/documentation/site
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: documentation-screenshots
          path: .artifacts/documentation/screenshots
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'bioinfornatics/agent-plugins'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure publication identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: .artifacts/documentation/site
      - name: Publish approved documentation candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENTATION_CI: '1'
        run: bash scripts/publish-documentation.sh origin
      # GITHUB_TOKEN pushes do not trigger Pages automatically; explicitly request a build.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
