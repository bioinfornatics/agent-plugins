name: Promote production
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Approved open source-to-main promotion request number
        required: true
        type: string
      expected_main:
        description: Exact current main commit (race guard)
        required: true
        type: string
      owner_manual:
        description: Explicit personal repository owner authorization (not independent review)
        default: false
        type: boolean
      expected_source:
        description: Exact source SHA required for owner manual authorization
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-promotion
  cancel-in-progress: false
jobs:
  resolve:
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["refs/heads/develop"]'), github.ref)) || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(fromJSON('["develop"]'), github.event.pull_request.head.ref) && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request || github.event.pull_request.number }}
          OWNER_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_manual }}
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
          EXPECTED_MAIN: ${{ inputs.expected_main || github.event.pull_request.base.sha }}
        run: |
          if [ "$OWNER_MANUAL" = true ]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
            node scripts/production-request.mjs "$PR_NUMBER" "$EXPECTED_MAIN" "$EXPECTED_SOURCE" >> "$GITHUB_OUTPUT"
          else
            node scripts/production-request.mjs "$PR_NUMBER" "$EXPECTED_MAIN" >> "$GITHUB_OUTPUT"
          fi
  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      run_id: ${{ steps.proof.outputs.verification_run }}
      run_attempt: ${{ steps.proof.outputs.verification_attempt }}
      artifact_id: ${{ steps.proof.outputs.candidate_artifact }}
      artifact_digest: ${{ steps.proof.outputs.candidate_digest }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Await canonical exact-SHA develop verification (no duplicate suite)
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: node scripts/production-verification.mjs "$VERIFIED_SHA" 1500
  publish:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Attach exact verified source to its approved branch
        env:
          VERIFIED_SHA: ${{ needs.resolve.outputs.source_sha }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          case "$SOURCE_BRANCH" in develop) ;; *) exit 1 ;; esac
          git switch -c "$SOURCE_BRANCH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Install checksum-pinned Goose
        run: |
          curl --fail --location --retry 3 https://github.com/aaif-goose/goose/releases/download/v1.57.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          echo 'e54036f3b7f95d3b0d7854c09465af5ef52a28c7fa03d2497d0ea68a6382282d  /tmp/goose.tar.bz2' | sha256sum -c -
          mkdir /tmp/goose-bin
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-bin
          echo /tmp/goose-bin >> "$GITHUB_PATH"
          test -x /tmp/goose-bin/goose
          echo "GOOSE_TEST_BINARY=/tmp/goose-bin/goose" >> "$GITHUB_ENV"
      - name: Download and authenticate the pinned candidate archive
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
        run: node scripts/candidate-transfer.mjs download "$RUNNER_TEMP/candidate.json"
      - name: Restore bounded data-only frozen candidate
        env:
          CANDIDATE_SOURCE: ${{ needs.resolve.outputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ needs.verify.outputs.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify.outputs.run_attempt }}
        run: node scripts/candidate-transfer.mjs unpack "$RUNNER_TEMP/candidate.json" "$RUNNER_TEMP/frozen-candidate"
      - name: Recheck approval and publish generated tree without merging source
        env:
          OWNER_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_manual }}
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
          EXPECTED_MAIN: ${{ inputs.expected_main || github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ inputs.pull_request || github.event.pull_request.number }}
          VERIFIED_SHA: ${{ needs.resolve.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ needs.verify.outputs.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ needs.verify.outputs.run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/production-verification.mjs "$VERIFIED_SHA"
          node scripts/production-request.mjs "$PR_NUMBER" "$EXPECTED_MAIN" "$VERIFIED_SHA"
          node scripts/promote-production.mjs origin "$EXPECTED_MAIN" "$RUNNER_TEMP/frozen-candidate" --push
          gh pr close "$PR_NUMBER" --comment "Published generated runtime distribution from $VERIFIED_SHA. Closed without merging authoring files into main."
