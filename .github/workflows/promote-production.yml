name: Promote production
on:
  workflow_dispatch:
    inputs:
      expected_main:
        description: Exact current main commit (race guard)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-promotion
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/development'
    uses: ./.github/workflows/development-ci.yml
    permissions:
      contents: read
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: development
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse source movement since verification
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Install checksum-pinned Goose
        run: |
          curl --fail --location --retry 3 https://github.com/aaif-goose/goose/releases/download/v1.47.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          echo 'a8340f47db1d33726fb031ca56e6d8bf05a7df923abdc96ae4bcbf6472de1664  /tmp/goose.tar.bz2' | sha256sum -c -
          mkdir /tmp/goose-bin
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-bin
          echo /tmp/goose-bin >> "$GITHUB_PATH"
      - name: Promote verified tree with normal fast-forward push
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/promote-production.mjs origin "$EXPECTED_MAIN" --push
