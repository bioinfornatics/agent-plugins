name: Promote production
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Approved open source-to-main promotion request number
        required: true
        type: string
      expected_main:
        description: Exact current main commit (race guard)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-promotion
  cancel-in-progress: false
jobs:
  resolve:
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["refs/heads/development","refs/heads/develop"]'), github.ref)) || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(fromJSON('["development","develop"]'), github.event.pull_request.head.ref) && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request || github.event.pull_request.number }}
          EXPECTED_MAIN: ${{ inputs.expected_main || github.event.pull_request.base.sha }}
        run: node scripts/production-request.mjs "$PR_NUMBER" "$EXPECTED_MAIN" >> "$GITHUB_OUTPUT"
  verify:
    needs: resolve
    uses: ./.github/workflows/development-ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
    permissions:
      contents: read
  publish:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Attach exact verified source to its approved branch
        env:
          VERIFIED_SHA: ${{ needs.resolve.outputs.source_sha }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          case "$SOURCE_BRANCH" in development|develop) ;; *) exit 1 ;; esac
          git switch -c "$SOURCE_BRANCH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Install checksum-pinned Goose
        run: |
          curl --fail --location --retry 3 https://github.com/aaif-goose/goose/releases/download/v1.47.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          echo 'a8340f47db1d33726fb031ca56e6d8bf05a7df923abdc96ae4bcbf6472de1664  /tmp/goose.tar.bz2' | sha256sum -c -
          mkdir /tmp/goose-bin
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-bin
          echo /tmp/goose-bin >> "$GITHUB_PATH"
      - name: Recheck approval and publish generated tree without merging source
        env:
          EXPECTED_MAIN: ${{ inputs.expected_main || github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ inputs.pull_request || github.event.pull_request.number }}
          VERIFIED_SHA: ${{ needs.resolve.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/production-request.mjs "$PR_NUMBER" "$EXPECTED_MAIN" "$VERIFIED_SHA"
          node scripts/promote-production.mjs origin "$EXPECTED_MAIN" --push
          gh pr close "$PR_NUMBER" --comment "Published generated runtime distribution from $VERIFIED_SHA. Closed without merging authoring files into main."
