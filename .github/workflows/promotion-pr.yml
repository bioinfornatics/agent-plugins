name: Promotion request verification
on:
  # Runs even for source-to-distribution merge conflicts. No PR code is executed.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  promotion-preflight:
    if: github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0' # Latest LTS, pinned for reproducibility (2026-11-10)
          package-manager-cache: false
      - name: Verify request with trusted base-tree code only
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MAIN: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/promotion-preflight.mjs
