name: Exhaustive distribution verification
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exhaustive-distribution-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve exact develop source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/branches?per_page=100" | jq -r 'add | map(select(.name == "develop")) | .[0].commit.sha // empty')
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0' # Latest LTS, pinned for reproducibility (2026-11-10)
          package-manager-cache: false
      - name: Install checksum-pinned Goose
        run: |
          curl --fail --location --retry 3 https://github.com/aaif-goose/goose/releases/download/v1.57.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          echo 'e54036f3b7f95d3b0d7854c09465af5ef52a28c7fa03d2497d0ea68a6382282d  /tmp/goose.tar.bz2' | sha256sum -c -
          mkdir /tmp/goose-bin
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-bin
          echo /tmp/goose-bin >> "$GITHUB_PATH"
          echo "GOOSE_TEST_BINARY=/tmp/goose-bin/goose" >> "$GITHUB_ENV"
          echo "CI_REQUIRE_GOOSE_HOST=1" >> "$GITHUB_ENV"
      - name: Reproducible isolated build and targeted projection checks
        run: node scripts/ci-step.mjs reproducibility node scripts/test-clean-source-reproducibility.mjs --build-only
      - name: Restore offline test dependencies
        run: node scripts/prepare-development.mjs
      - name: Exhaustive current Node and distribution contracts (native packaging retired)
        run: node scripts/ci-step.mjs exhaustive node scripts/test.mjs --profile=full
      - name: Upload detailed verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exhaustive-ci-logs
          path: .artifacts/ci-logs
          retention-days: 14
          if-no-files-found: ignore
