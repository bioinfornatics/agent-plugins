name: Exhaustive distribution verification
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exhaustive-distribution-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve exact develop source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/branches?per_page=100" | jq -r 'add | map(select(.name == "develop")) | .[0].commit.sha // empty')
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.12
      - name: Install checksum-pinned Goose
        run: |
          curl --fail --location --retry 3 https://github.com/aaif-goose/goose/releases/download/v1.47.0/goose-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/goose.tar.bz2
          echo 'a8340f47db1d33726fb031ca56e6d8bf05a7df923abdc96ae4bcbf6472de1664  /tmp/goose.tar.bz2' | sha256sum -c -
          mkdir /tmp/goose-bin
          tar -xjf /tmp/goose.tar.bz2 -C /tmp/goose-bin
          echo /tmp/goose-bin >> "$GITHUB_PATH"
          test -x /usr/bin/google-chrome || test -x /usr/bin/chromium
      - name: Reproducible isolated build and targeted projection checks
        run: node scripts/ci-step.mjs reproducibility node scripts/test-clean-source-reproducibility.mjs --build-only
      - name: Restore offline test dependencies
        run: node scripts/prepare-development.mjs
      - name: Exhaustive tests including five-platform native packaging
        run: node scripts/ci-step.mjs exhaustive node scripts/test.mjs --profile=full
      - name: Upload detailed verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exhaustive-ci-logs
          path: .artifacts/ci-logs
          retention-days: 14
          if-no-files-found: ignore
