[project]
site_name = "Agent Plugins"
site_description = "Learn to create, validate, and evaluate reusable agent capabilities."
site_url = "https://bioinfornatics.github.io/agent-plugins/en/"
docs_dir = "docs/site/en"
site_dir = ".artifacts/documentation/site/en"
repo_url = "https://github.com/bioinfornatics/agent-plugins"
repo_name = "bioinfornatics/agent-plugins"
nav = [
  {"Home" = "index.md"},
  {"Concepts" = "concepts.md"},
  {"Getting started" = "getting-started.md"},
  {"First Skill" = "tutorials/first-skill.md"},
  {"Choose a creator" = "how-to/creators.md"},
  {"Evaluate and improve" = "how-to/evaluate.md"},
  {"Reference" = "reference.md"},
  {"Contributing" = "contributing.md"}
]
extra_css = ["assets/documentation.css"]
extra_javascript = ["assets/language.js"]
[project.theme]
variant = "modern"
custom_dir = "docs/overrides"
language = "en"
font = false
features = ["content.code.copy", "navigation.sections", "navigation.footer", "navigation.top", "search.highlight"]
[project.theme.palette]
scheme = "default"
primary = "indigo"
accent = "teal"
[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences.custom_fences = [
  {name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format"},
]
